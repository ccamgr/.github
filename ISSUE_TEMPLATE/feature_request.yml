name: Feature request
description: Suggest an idea or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea.

  - type: checkboxes
    id: existing
    attributes:
      label: Before submitting
      options:
        - label: I have searched the existing issues for similar requests.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see?
      placeholder: Describe your idea.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Are there any alternative solutions or approaches?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else you'd like to add?
    validations:
      required: false
